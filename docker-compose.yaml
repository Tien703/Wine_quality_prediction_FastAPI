version: '3.8'

services:
  backend:
    build:
      context: . # Lấy thư mục gốc làm chuẩn để có thể copy model AI
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend
